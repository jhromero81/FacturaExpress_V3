# ============================================================
# FacturaExpress - Integracion continua
#
# Se ejecuta en cada push y pull request a main:
#   1. Pruebas unitarias y de integracion del backend (sin base de datos).
#   2. Auditoria de dependencias del backend.
#   3. Pruebas y compilacion de produccion del frontend.
#   4. Pruebas de aceptacion de extremo a extremo contra un MySQL real.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - pruebas y auditoria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias y de integracion
        run: npm test

      - name: Auditoria de dependencias de produccion
        run: npm audit --omit=dev

  frontend:
    name: Frontend - pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test -- --watch=false

      - name: Compilacion de produccion
        run: npm run build

  e2e:
    name: Aceptacion E2E contra MySQL
    runs-on: ubuntu-latest
    needs: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: facturaexpress_apirest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: facturaexpress_apirest
      DB_USER: root
      DB_PASSWORD: root_ci
      DB_SKIP_CREATE: '1'
      JWT_SECRET: secreto_de_integracion_continua_1234567890
      JWT_ISSUER: facturaexpress-api
      JWT_AUDIENCE: facturaexpress-web
      NODE_ENV: development
      PORT: '4000'
      E2E_BASE_URL: http://127.0.0.1:4000
      E2E_NIT: 900.123.456-7
      E2E_PASSWORD: Integracion2026x
      E2E_VENDEDOR_NIT: 80.987.654-3
      E2E_VENDEDOR_PASSWORD: Integracion2026v
      # Contrasenas deterministas del seed para que la prueba sea reproducible
      SEED_ADMIN_PASSWORD: Integracion2026x
      SEED_VENDEDOR_PASSWORD: Integracion2026v
      SEED_CONTADOR_PASSWORD: Integracion2026c

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Crear esquema y datos de ejemplo
        working-directory: backend
        run: |
          npm run db:seed
          npm run db:migrate

      - name: Arrancar la API
        working-directory: backend
        run: |
          node server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/api/health > /dev/null; then
              echo "API disponible"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondio a tiempo"
          cat api.log
          exit 1

      - name: Pruebas de aceptacion
        working-directory: backend
        run: npm run test:e2e

      - name: Registro de la API ante un fallo
        if: failure()
        working-directory: backend
        run: cat api.log || true
