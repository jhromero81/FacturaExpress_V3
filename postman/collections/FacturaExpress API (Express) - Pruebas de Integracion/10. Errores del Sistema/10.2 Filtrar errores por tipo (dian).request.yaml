$kind: http-request
url: "{{baseUrl}}/errores?tipo=dian"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Filtro por tipo (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
