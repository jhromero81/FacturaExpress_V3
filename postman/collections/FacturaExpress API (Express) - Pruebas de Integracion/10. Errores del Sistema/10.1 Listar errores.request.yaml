$kind: http-request
url: "{{baseUrl}}/errores"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Errores listados (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Devuelve contadores y errores', function () {
          const json = pm.response.json();
          pm.expect(json.total).to.be.a('number');
          pm.expect(json.errores).to.be.an('array');
      });
    language: text/javascript
order: 1000
