$kind: http-request
url: "{{baseUrl}}/errores?resuelto=false"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.errores.length > 0) {
          pm.collectionVariables.set('errorId', String(json.errores[0].id));
      }
      pm.test('Errores pendientes consultados (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
