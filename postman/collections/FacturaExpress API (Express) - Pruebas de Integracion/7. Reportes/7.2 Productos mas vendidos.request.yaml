$kind: http-request
url: "{{baseUrl}}/reportes/productos-top?limite=5"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Productos mas vendidos (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Devuelve ranking de productos', function () {
          pm.expect(pm.response.json().productos).to.be.an('array');
      });
    language: text/javascript
order: 2000
