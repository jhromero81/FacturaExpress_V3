$kind: http-request
url: "{{baseUrl}}/reportes/historial"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Historial de reportes (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('El reporte PDF generado quedo persistido', function () {
          const json = pm.response.json();
          const recientes = json.reportes.filter(function (r) { return r.tipo === 'pdf'; });
          pm.expect(recientes.length).to.be.at.least(1);
      });
    language: text/javascript
order: 4000
