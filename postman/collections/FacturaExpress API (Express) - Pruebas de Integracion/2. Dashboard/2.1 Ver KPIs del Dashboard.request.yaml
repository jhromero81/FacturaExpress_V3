$kind: http-request
url: "{{baseUrl}}/reportes/kpis"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('KPIs disponibles (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Estructura de KPIs completa', function () {
          const k = pm.response.json().kpis;
          pm.expect(k).to.have.property('ventasDia');
          pm.expect(k).to.have.property('facturasEmitidas');
          pm.expect(k).to.have.property('pendientesDIAN');
          pm.expect(k).to.have.property('avanceMeta');
      });
    language: text/javascript
order: 1000
