$kind: http-request
url: "{{baseUrl}}/reportes/ventas-semanales"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Ventas semanales (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().ventas).to.be.an('array');
      });
    language: text/javascript
order: 2000
