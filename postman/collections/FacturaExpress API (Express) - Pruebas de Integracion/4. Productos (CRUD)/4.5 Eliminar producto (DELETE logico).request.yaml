$kind: http-request
url: "{{baseUrl}}/productos/{{productoId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Producto eliminado logicamente (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test('El producto ya no es visible (GET -> 404)', function () {
          pm.sendRequest({
              url: pm.collectionVariables.get('baseUrl') + '/productos/' + pm.collectionVariables.get('productoId'),
              method: 'GET',
              header: [{ 'key': 'Authorization', 'value': 'Bearer ' + pm.collectionVariables.get('token') }]
          }, function (err, resp) {
              pm.expect(resp.code).to.eql(404);
          });
      });
    language: text/javascript
order: 5000
