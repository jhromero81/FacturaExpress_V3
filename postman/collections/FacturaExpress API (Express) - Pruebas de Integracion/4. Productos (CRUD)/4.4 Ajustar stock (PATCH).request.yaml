$kind: http-request
url: "{{baseUrl}}/productos/{{productoId}}/stock"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "cantidad": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Ajuste de stock (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('El stock incremento en 5 unidades', function () {
          const json = pm.response.json();
          pm.expect(json.producto.stock).to.eql(105);
      });
    language: text/javascript
order: 4000
