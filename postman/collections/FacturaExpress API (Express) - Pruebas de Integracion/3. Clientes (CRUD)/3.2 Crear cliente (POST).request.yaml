$kind: http-request
url: "{{baseUrl}}/clientes"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "identificacion": "901.{{ts}}-1",
      "nombre": "Cliente Integracion Postman",
      "email": "integracion_{{ts}}@correo.com",
      "telefono": "3001234567"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cliente creado (HTTP 201)', function () {
          pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Devuelve el cliente persistido con id', function () {
          pm.expect(json.cliente.id).to.be.a('number');
          pm.expect(json.cliente.nombre).to.eql('Cliente Integracion Postman');
      });
      pm.collectionVariables.set('clienteId', String(json.cliente.id));
    language: text/javascript
order: 2000
