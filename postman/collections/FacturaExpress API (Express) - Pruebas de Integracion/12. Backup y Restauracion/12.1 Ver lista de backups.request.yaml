$kind: http-request
url: "{{baseUrl}}/backup"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Lista de backups (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().backups).to.be.an('array');
      });
    language: text/javascript
order: 1000
