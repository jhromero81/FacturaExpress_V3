$kind: http-request
url: "{{baseUrl}}/usuarios/{{usuarioId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "nombre": "Vendedor Actualizado Postman",
      "email": "vendedor_act_{{ts}}@correo.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Usuario actualizado (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Cambios persistidos en la respuesta', function () {
          const json = pm.response.json();
          pm.expect(json.usuario.nombre).to.eql('Vendedor Actualizado Postman');
      });
    language: text/javascript
order: 3000
