$kind: http-request
url: "{{baseUrl}}/usuarios"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "nit": "903.{{ts}}-2",
      "nombre": "Vendedor Integracion Postman",
      "email": "vendedor_{{ts}}@correo.com",
      "rol": "vendedor",
      "password": "Password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Usuario creado (HTTP 201)', function () {
          pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Rol vendedor asignado y sin hash expuesto', function () {
          pm.expect(json.usuario.rol).to.eql('vendedor');
          pm.expect(json.usuario.password_hash).to.be.undefined;
      });
      pm.collectionVariables.set('usuarioId', String(json.usuario.id));
    language: text/javascript
order: 2000
