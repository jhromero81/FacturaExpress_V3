$kind: http-request
url: "{{baseUrl}}/facturas/{{facturaId}}/estado"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "estado": "estado_invalido"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado invalido rechazado (HTTP 400)', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 8000
