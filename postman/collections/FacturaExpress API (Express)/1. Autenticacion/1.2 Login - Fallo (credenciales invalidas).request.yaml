$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nit": "usuario_invalido",
      "password": "clave_incorrecta"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Rechaza credenciales invalidas (HTTP 401)', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 2000
