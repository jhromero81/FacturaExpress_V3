$kind: http-request
name: 4.4 Eliminar producto (ID inexistente -> 404)
url: "{{baseUrl}}/productos/999999"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('ID inexistente devuelve 404', function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 4000
