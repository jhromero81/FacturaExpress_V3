$kind: http-request
url: "{{baseUrl}}/reportes/ultimas-transacciones?limite=4"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  limite: "4"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Ultimas transacciones (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().transacciones).to.be.an('array');
      });
    language: text/javascript
order: 3000
