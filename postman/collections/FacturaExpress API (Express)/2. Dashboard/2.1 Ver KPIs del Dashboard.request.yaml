$kind: http-request
url: "{{baseUrl}}/reportes/kpis"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('KPIs cargados (HTTP 200)', function () {
          pm.response.to.have.status(200);
          const json = pm.response.json();
          pm.expect(json.kpis.ventasMes).to.be.a('number');
          pm.expect(json.kpis.facturasEmitidas).to.be.a('number');
      });
    language: text/javascript
order: 1000
