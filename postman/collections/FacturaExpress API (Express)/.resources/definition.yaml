$kind: collection
name: FacturaExpress API (Express)
description: |-
  Coleccion de pruebas para la API REST Express de FacturaExpress (puerto 4000). Adaptacion de las colecciones Postman del proyecto Java (Spring MVC + CSRF) al esquema JSON REST + Bearer JWT.

  Uso:
  1. Importar esta coleccion en Postman.
  2. Asegurarse de que el backend este corriendo (npm run dev en backend/).
  3. Ejecutar "1.1 Login - Exito (admin)" para obtener el token JWT (se guarda automaticamente en la variable de coleccion token).
  4. Ejecutar el resto de carpetas en orden; los IDs creados se guardan como variables (clienteId, productoId, facturaId, usuarioId).
variables:
  baseUrl: http://localhost:4000/api
  token: ""
  clienteId: "1"
  productoId: "1"
  facturaId: "1"
  usuarioId: "1"
  archivoBackup: ""
  errorId: "1"
