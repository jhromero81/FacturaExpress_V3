$kind: http-request
url: "{{baseUrl}}/facturas/{{facturaId}}/csv"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('CSV de factura descargado', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 7000
