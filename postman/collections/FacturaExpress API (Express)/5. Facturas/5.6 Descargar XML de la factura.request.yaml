$kind: http-request
url: "{{baseUrl}}/facturas/{{facturaId}}/xml"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('XML de factura descargado', function () {
          pm.response.to.have.status(200);
          pm.response.to.have.header('Content-Type');
      });
    language: text/javascript
order: 6000
