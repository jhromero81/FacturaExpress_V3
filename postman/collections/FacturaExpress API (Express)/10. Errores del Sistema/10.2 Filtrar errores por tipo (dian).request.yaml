$kind: http-request
url: "{{baseUrl}}/errores?tipo=dian"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  tipo: dian
scripts:
  - type: afterResponse
    code: |-
      pm.test('Filtro por tipo dian (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().errores).to.be.an('array');
      });
    language: text/javascript
order: 2000
