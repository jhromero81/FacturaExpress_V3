$kind: http-request
name: 9.4 Desactivar / Activar usuario
url: "{{baseUrl}}/usuarios/{{usuarioId}}/activo"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "activo": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Toggle activo (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Usuario desactivado', function () {
          pm.expect(json.usuario.activo).to.eql(false);
      });
    language: text/javascript
order: 4000
