$kind: http-request
url: "{{baseUrl}}/reportes/ventas-periodo?periodo=mensual"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  periodo: mensual
scripts:
  - type: afterResponse
    code: |-
      pm.test('Ventas agrupadas por periodo (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().ventas).to.be.an('array');
      });
    language: text/javascript
order: 1000
