$kind: http-request
url: "{{baseUrl}}/configuracion/dian/sync"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sincronizacion DIAN (HTTP 200)', function () {
          pm.response.to.have.status(200);
          const json = pm.response.json();
          pm.expect(json.fiscal.ultimaSync).to.be.a('string');
      });
    language: text/javascript
order: 3000
