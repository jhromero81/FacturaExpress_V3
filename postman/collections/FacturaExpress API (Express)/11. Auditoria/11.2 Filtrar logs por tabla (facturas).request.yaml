$kind: http-request
url: "{{baseUrl}}/logs?tabla=facturas"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  tabla: facturas
scripts:
  - type: afterResponse
    code: |-
      pm.test('Logs filtrados por tabla facturas (HTTP 200)', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().logs).to.be.an('array');
      });
    language: text/javascript
order: 2000
