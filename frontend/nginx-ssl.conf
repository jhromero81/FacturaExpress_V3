# ============================================================
# FacturaExpress - nginx del frontend con TLS
#
# Variante de nginx.conf para servir la SPA por HTTPS. Se activa
# montando este archivo sobre /etc/nginx/conf.d/default.conf y los
# certificados en /etc/nginx/certs (ver docs/Seguridad_FacturaExpress.md).
#
# Con HTTPS activo:
#   - la cookie de sesion viaja con el flag Secure (la API lo activa con
#     NODE_ENV=production);
#   - nginx envia X-Forwarded-Proto: https, de modo que la API conoce el
#     esquema original de la peticion.
#
# Uso rapido (autofirmado, solo para pruebas locales):
#   mkdir -p certs
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/privkey.pem -out certs/fullchain.pem \
#     -subj "/CN=localhost"
#   docker run -p 443:443 -v "$PWD/certs:/etc/nginx/certs:ro" \
#     -v "$PWD/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
# ============================================================

# Redireccion permanente de HTTP a HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS: el navegador solo contactara este host por HTTPS.
    # Empiece con un max-age corto si el dominio es nuevo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: proxy hacia el servicio "api" de docker-compose.
    # Las cookies httpOnly de sesion viajan sin problema al ser mismo origen.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta no encontrada cae en index.html (enrutado Angular).
    # La CSP autoriza los dominios de Google Fonts que usa index.html; si
    # autoaloja las fuentes, quite esas dos excepciones.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # Cache prolongada para assets con hash; sin cache para index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
