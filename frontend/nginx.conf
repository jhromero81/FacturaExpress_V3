# FacturaExpress - nginx del frontend
# Sirve la SPA Angular y redirige las peticiones /api al backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion basica para los assets de la SPA
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: proxy hacia el servicio "api" de docker-compose.
    # Las cookies httpOnly de sesion viajan sin problema al ser mismo origen.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta no encontrada cae en index.html (enrutado Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache prolongada para assets con hash; sin cache para index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
