# FacturaExpress - nginx del frontend
# Sirve la SPA Angular y redirige las peticiones /api al backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion basica para los assets de la SPA
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: proxy hacia el servicio "api" de docker-compose.
    # Las cookies httpOnly de sesion viajan sin problema al ser mismo origen.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta no encontrada cae en index.html (enrutado Angular)
    # Cabeceras de seguridad aplicadas solo al HTML principal (la API ya
    # fija las suyas via helmet y los assets con hash usan cache propia).
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # Cache prolongada para assets con hash; sin cache para index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
